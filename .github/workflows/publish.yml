# THE FIRST PUBLISH CANNOT HAPPEN HERE. Do it by hand.
#
# This workflow authenticates with npm Trusted Publishing: `id-token: write`
# plus `npm publish --provenance`, and no NODE_AUTH_TOKEN anywhere. Trusted
# Publishing is configured per package on npmjs.com, under the package's
# Settings, and a package that does not exist yet has no settings page. So on a
# first run the version check reads `published=none`, decides there is work to
# do, and the publish step 404s on the PUT.
#
# First release, once:
#   npm login
#   npm publish --access public          # from a clean checkout of main
# or publish from CI with a granular access token in NODE_AUTH_TOKEN.
#
# Then, on npmjs.com > the package > Settings > Trusted Publisher, add this
# repository and this workflow file. Every release after that runs here, and
# keeps provenance.
name: Publish

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:

# Serialize publishes: each step checks a target, then writes it; overlapping runs
# could both see "missing". Never cancel a run mid-publish.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          # Node 24 ships npm >=11.5.1 with sigstore intact; self-upgrading npm on the
          # Node 22 runner broke provenance publish ("Cannot find module sigstore").
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check if package.json version is already published
        id: version
        run: |
          LOCAL_VERSION="$(node -p "require('./package.json').version")"
          PKG_NAME="$(node -p "require('./package.json').name")"
          PUBLISHED_VERSION="$(npm view "$PKG_NAME" version 2>/dev/null || echo none)"
          echo "local=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "package.json version ($LOCAL_VERSION) is already published — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "package.json version ($LOCAL_VERSION) differs from published ($PUBLISHED_VERSION) — publishing."
          fi

      - name: Install dependencies
        if: steps.version.outputs.changed == 'true'
        run: npm ci

      - name: Build
        if: steps.version.outputs.changed == 'true'
        run: npm run build --if-present

      - name: Test
        if: steps.version.outputs.changed == 'true'
        run: npm test --if-present

      - name: Show tool versions
        if: steps.version.outputs.changed == 'true'
        run: node --version && npm --version

      # Trusted Publishing only. This fails with a 404 until the package exists
      # on npm and has this repo registered as a trusted publisher — see the
      # comment at the top of this file for the one-time manual first publish.
      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        run: npm publish --provenance --access public

      # npm can take a minute or more to serve a version it just accepted, and both
      # mcp-publisher (it checks the npm package version) and the GitHub release need
      # it. Wait (bounded) here, before either. Ungated on purpose: on a catch-up or
      # no-op run the version is already on npm and the first check passes at once.
      - name: Wait for npm to serve this version
        env:
          VERSION: ${{ steps.version.outputs.local }}
        run: |
          PKG="$(node -p "require('./package.json').name")"
          for attempt in $(seq 1 10); do
            [ "$(npm view "$PKG@$VERSION" version 2>/dev/null)" = "$VERSION" ] && break
            [ "$attempt" = 10 ] && { echo "::error::$PKG@$VERSION is still not on npm after ~5 minutes; not publishing to the MCP registry or creating a GitHub release for an unpublished version. Re-run the workflow once npm serves it."; exit 1; }
            sleep 30
          done
          echo "npm serves $PKG@$VERSION."

      # server.json is derived from package.json at publish time so the two can
      # never drift again — the registry stayed pinned at the June 2026 versions
      # because server.json was hand-maintained and nobody re-published it.
      - name: Sync server.json version from package.json
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const server = JSON.parse(fs.readFileSync("server.json", "utf8"));
            server.version = pkg.version;
            for (const p of server.packages || []) p.version = pkg.version;
            fs.writeFileSync("server.json", JSON.stringify(server, null, 2) + "\n");
          '
          node -p "\"server.json is now at \" + require('./server.json').version"

      # Checked independently of the npm gate above: npm and the registry can be
      # out of sync on their own, so a workflow_dispatch has to be able to push a
      # registry-only catch-up without an npm version bump.
      - name: Check if version is already in the MCP registry
        id: registry
        run: |
          SERVER_NAME="$(node -p "require('./package.json').mcpName")"
          LOCAL_VERSION="${{ steps.version.outputs.local }}"
          if curl -fsSL "https://registry.modelcontextprotocol.io/v0.1/servers?search=$SERVER_NAME" -o registry.json; then
            # Ask whether THIS version is present: the registry lists every version, and the
            # first entry with a matching name is not necessarily the newest one.
            REGISTRY_VERSION="$(SERVER_NAME="$SERVER_NAME" LOCAL_VERSION="$LOCAL_VERSION" node -p "const r = JSON.parse(require('fs').readFileSync('registry.json', 'utf8')).servers || []; const ex = r.filter(s => s.server && s.server.name === process.env.SERVER_NAME); const hit = ex.find(s => s.server.version === process.env.LOCAL_VERSION); hit ? hit.server.version : (ex.map(s => s.server.version).join(',') || 'none')")"
          else
            REGISTRY_VERSION=unknown
            echo "Registry lookup failed — will attempt the publish and let it decide."
          fi
          rm -f registry.json
          if [ "$LOCAL_VERSION" = "$REGISTRY_VERSION" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "MCP registry already has $SERVER_NAME@$LOCAL_VERSION — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "MCP registry has $REGISTRY_VERSION, package.json is $LOCAL_VERSION — publishing."
          fi

      - name: Publish to the MCP registry
        if: steps.registry.outputs.changed == 'true'
        # Pinned: an unpinned /latest/ URL silently changes the CLI under CI.
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      # Gated on "the release is missing", never on "npm published in this run": a
      # catch-up dispatch after an npm-lag failure must still finish the release.
      - name: Create GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.local }}
        run: |
          # Only "release not found" means missing; any other gh failure stops the run
          # rather than racing a create against a release that may already exist.
          if VIEW="$(gh release view "v$VERSION" 2>&1)"; then
            echo "Release v$VERSION already exists — skipping."
            exit 0
          elif ! printf '%s' "$VIEW" | grep -qi 'release not found'; then
            echo "::error::Could not check for release v$VERSION: $VIEW"
            exit 1
          fi
          # "Wait for npm to serve this version" above has already confirmed npm serves
          # it, so this never creates a release for an unpublished version.
          # Target main's own commit that set this version (first parent, so a merge
          # commit counts), not whatever HEAD is when a catch-up runs.
          # Escape every ERE metacharacter in the version (dots, and "+" in build metadata).
          VERSION_RE="$(printf '%s' "$VERSION" | sed 's/[][\\.*^$+?(){}|]/\\&/g')"
          SETS_VERSION="\"version\"[[:space:]]*:[[:space:]]*\"$VERSION_RE\""
          TARGET="$(git log -1 --first-parent --diff-merges=first-parent --no-patch --format=%H -G"$SETS_VERSION" -- package.json)"
          if [ -z "$TARGET" ] || ! git merge-base --is-ancestor "$TARGET" HEAD; then
            echo "::error::Could not find the commit on main that set version $VERSION in package.json."
            exit 1
          fi
          gh release create "v$VERSION" --target "$TARGET" --generate-notes
