# THE FIRST PUBLISH CANNOT HAPPEN HERE. Do it by hand.
#
# This workflow authenticates with npm Trusted Publishing: `id-token: write`
# plus `npm publish --provenance`, and no NODE_AUTH_TOKEN anywhere. Trusted
# Publishing is configured per package on npmjs.com, under the package's
# Settings, and a package that does not exist yet has no settings page. So on a
# first run the version check reads `published=none`, decides there is work to
# do, and the publish step 404s on the PUT.
#
# First release, once:
#   npm login
#   npm publish --access public          # from a clean checkout of main
# or publish from CI with a granular access token in NODE_AUTH_TOKEN.
#
# Then, on npmjs.com > the package > Settings > Trusted Publisher, add this
# repository and this workflow file. Every release after that runs here, and
# keeps provenance.
name: Publish

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Node 24 ships npm >=11.5.1 with sigstore intact; self-upgrading npm on the
          # Node 22 runner broke provenance publish ("Cannot find module sigstore").
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check if package.json version is already published
        id: version
        run: |
          LOCAL_VERSION="$(node -p "require('./package.json').version")"
          PKG_NAME="$(node -p "require('./package.json').name")"
          PUBLISHED_VERSION="$(npm view "$PKG_NAME" version 2>/dev/null || echo none)"
          echo "local=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "package.json version ($LOCAL_VERSION) is already published — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "package.json version ($LOCAL_VERSION) differs from published ($PUBLISHED_VERSION) — publishing."
          fi

      - name: Install dependencies
        if: steps.version.outputs.changed == 'true'
        run: npm ci

      - name: Build
        if: steps.version.outputs.changed == 'true'
        run: npm run build --if-present

      - name: Test
        if: steps.version.outputs.changed == 'true'
        run: npm test --if-present

      - name: Show tool versions
        if: steps.version.outputs.changed == 'true'
        run: node --version && npm --version

      # Trusted Publishing only. This fails with a 404 until the package exists
      # on npm and has this repo registered as a trusted publisher — see the
      # comment at the top of this file for the one-time manual first publish.
      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        run: npm publish --provenance --access public

      - name: Create GitHub release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.local }}"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — skipping."
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" --generate-notes
          fi
